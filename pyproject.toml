[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "longmem"
version = "0.1.1"
description = "Append-only, searchable memory for long coding-agent sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "LongMem contributors" }
]
keywords = ["coding-agent", "codex", "claude-code", "memory", "jsonl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = []

[project.scripts]
longmem = "longmem.cli:main"

[tool.setuptools.packages.find]
include = ["longmem*"]

[tool.setuptools.package-data]
longmem = ["templates/*", "templates/**/*"]
